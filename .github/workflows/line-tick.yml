# Runs the LINE app scheduler (SLA watchdog, reminders, no-show, aftercare, CSAT) every 5 minutes.
# Vercel Hobby only allows daily crons, so GitHub Actions calls the endpoint instead.
# The endpoint only performs work that is already due, is idempotent and throttled, so no secret is needed.
name: line-tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call scheduler
        run: curl -fsS --max-time 60 https://vinfinity-line.vercel.app/api/cron/tick
